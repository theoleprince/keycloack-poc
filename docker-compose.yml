# POC Keycloak multi-sociétés — environnement de DEV uniquement.
# Les identifiants ci-dessous sont des valeurs de dev (à ne jamais réutiliser).
services:
  keycloak-db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-dev-only-keycloak-db}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-dev-only-keycloak-db}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-dev-only-admin}
      # Piège de l'issuer : l'URL "frontend" fixe la valeur de `iss`.
      # L'émulateur Android joint l'hôte via 10.0.2.2 : on fige donc l'issuer
      # sur http://10.0.2.2:8080 pour que Flutter ET Laravel voient le même `iss`.
      # Les appels "backchannel" (JWKS, token, admin API depuis Laravel sur
      # localhost:8080) restent possibles grâce à HOSTNAME_BACKCHANNEL_DYNAMIC.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://10.0.2.2:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/realm-plateforme.json:/opt/keycloak/data/import/realm-plateforme.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak-db-data:
